[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; db host/user/password intentionally NOT set here - the odoo docker
; image entrypoint injects them from the HOST/USER/PASSWORD
; environment variables in docker-compose.yml, so the real credentials
; live in one place, not duplicated into this file.

; This placeholder is deliberately left as-is in git - deploy/deploy.sh
; overwrites it on every run from real values in a gitignored .env file
; (see .env.example) so secrets and instance-specific names never live in
; this tracked file. If you're not using deploy.sh, replace these
; manually before first boot and never commit the real values.
admin_passwd = CHANGE-ME-strong-unique-password

proxy_mode = True

; Single production database, hidden database-manager screen - a
; visitor to the login page should not see a list of every database
; on the server. deploy/deploy.sh rewrites BOTH settings below from
; ODOO_DB_NAME / ODOO_DBFILTER in .env.
list_db = False
db_name = CHANGE-ME-prod-db
dbfilter = ^CHANGE-ME-prod-db$

; --- Sizing ---
; Starting point for a small-to-mid deployment (roughly up to ~100
; concurrent users) on a 4-8 GB server running all 18 modules in this
; suite. Re-check this math if you resize the server or the module
; count grows further:
;   worst case (workers + 1 cron thread) x limit_memory_hard
;   = (2 + 1) x 768 MB = ~2.3 GB, leaving headroom for the OS,
;   Postgres, and Caddy on a 4 GB box - go to workers=3-4 on 8 GB+.
workers = 2
max_cron_threads = 1
limit_memory_hard = 805306368
limit_memory_soft = 671088640
limit_time_cpu = 120
limit_time_real = 240

log_level = info
; Deliberately NOT under /var/lib/odoo (the data volume) - a separate,
; host-bind-mounted path (see docker-compose.prod.yml) so fail2ban on
; the host can watch it without reaching into a named Docker volume's
; internal storage location.
logfile = /var/log/odoo/odoo.log
log_db = False

; --- Outbound email (SMTP) ---
; Payslip emails, offer letters, and reminder notifications all send
; real mail. Fill these in with the client's actual mail relay, OR
; leave commented out and configure the same fields instead via
; Settings -> Technical -> Email -> Outgoing Mail Servers in the UI
; once the instance is running (either approach works - UI config
; takes precedence if both are set).
; email_from = no-reply@client-domain.example
; smtp_server = smtp.client-provider.example
; smtp_port = 587
; smtp_user = no-reply@client-domain.example
; smtp_password = CHANGE-ME
; smtp_ssl = True
