# FieldOpsPro Odoo configuration
# Mirrors the structure of the HRMS config (config/odoo.prod.conf) but
# uses a separate database and log file so the two programmes never
# interfere with each other.

[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; db credentials come from HOST/USER/PASSWORD env vars injected by
; docker-compose - do not hard-code them here.

admin_passwd = CHANGE-ME-strong-unique-password

proxy_mode = True

list_db = False
db_name = fieldops_prod
dbfilter = ^fieldops_prod$

workers = 2
max_cron_threads = 1
limit_memory_hard = 805306368
limit_memory_soft = 671088640
limit_time_cpu = 120
limit_time_real = 240

log_level = info
logfile = /var/log/odoo/odoo.log
log_db = False
