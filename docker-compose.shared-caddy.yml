# Overlay for the shared-Caddy VPS setup where two programmes run side by side:
#
#   Programme 1: bpro HCM/HRMS  (THIS stack)   → www.bprohrms.com
#   Programme 2: FieldOpsPro    (separate stack) → www.fieldopspro.in
#
# Only ONE Caddy container can bind ports 80/443 on a host, so this stack's
# own "caddy" service must NOT be started here.  Instead, this overlay joins
# the HRMS "odoo" container to the shared Caddy network under the alias
# "odoo" so the Caddyfile can reach it by that name.
#
# The FieldOpsPro stack does the same thing with its own overlay, joining
# the same network under the alias "fieldops-odoo".
#
# Usage (start db + odoo only, caddy comes from the shared network):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.shared-caddy.yml up -d db odoo
#
# Network name "caddy_net" must match whatever the Caddy container's
# docker-compose project creates. Adjust if your Caddy project uses a
# different network name.
services:
  odoo:
    networks:
      default: {}
      caddy_net:
        aliases:
          - odoo

networks:
  caddy_net:
    external: true
