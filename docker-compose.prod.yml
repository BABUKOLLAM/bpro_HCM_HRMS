# Production overlay - use alongside the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# `name:` below pins this project's Compose name (and therefore its
# default network, "bpro_hcm_hrms_default") regardless of whatever
# directory it's actually checked out into - this VPS hosts several
# products behind one shared edge Caddy instance (/root/edge, its own
# separate project, not part of this repo), which reaches each one by
# joining that product's own default network directly and calling its
# "odoo" service by that plain name (Docker's per-project DNS alias,
# free with any Compose service - no custom alias config needed on
# this side). That only works if this project's network name is
# exactly what the edge Caddy already expects; pinning it here means
# it stays correct even if this checkout ever gets cloned into a
# differently-named folder again.
#
# This stack deliberately does NOT run its own public-facing Caddy
# (the "caddy" service below has profiles: [standalone] specifically
# so a normal `docker compose up` never starts it) - every other
# product on this VPS follows the same pattern of leaving 80/443
# entirely to the shared edge instance. Running our own would fight
# the edge Caddy for those ports outright (confirmed live: a real
# attempt at running this stack's own Caddy failed immediately with
# "port is already allocated"). The "caddy" service stays defined,
# under that profile, only for a genuinely standalone deployment
# elsewhere with no shared edge proxy - start it explicitly with
# `--profile standalone` in that case, never on this VPS.
#
# restart: unless-stopped on db/odoo (added after a live incident: the
# db container came back up on its own after some disruption on the
# host, odoo didn't, and nothing noticed until a user reported the
# site down) - Docker's default with no restart policy at all is to
# leave a stopped container stopped, whether it stopped from a crash,
# an interrupted deploy, or the host rebooting. "unless-stopped" means
# Docker itself brings both back automatically in all of those cases,
# while still respecting a deliberate `docker compose stop`.
name: bpro_hcm_hrms

services:
  db:
    restart: unless-stopped

  odoo:
    restart: unless-stopped
    ports: !reset []
    command: odoo -c /etc/odoo/odoo.prod.conf
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      # A distinct bind-mounted (not named-volume) log path, so it has
      # a predictable host filesystem location - fail2ban (running on
      # the host, not in a container, since it needs to reach the
      # host's firewall) reads login failures from here. See
      # deploy/fail2ban/ and docs/SETUP_GUIDE.md.
      - ./logs/odoo:/var/log/odoo

  caddy:
    image: caddy:2-alpine
    profiles: [standalone]
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
