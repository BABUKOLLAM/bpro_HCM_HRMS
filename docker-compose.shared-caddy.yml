# Optional overlay for co-hosting this stack on a server that already runs
# a separate Caddy instance for another site (e.g. bpro's own VPS, which
# also hosts a client's ME Polymers ERP under its own docker-compose
# project named "deploy"). Ports 80/443 can only be bound by ONE Caddy
# container per host, so this stack's own "caddy" service must NOT be
# started here - instead, this file joins the "odoo" service to the
# other project's existing Docker network under a distinct alias, so
# that project's Caddy can reverse_proxy to it directly by name.
#
# Usage (deliberately excludes the caddy service):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.shared-caddy.yml up -d db odoo
#
# The external network name and alias are intentionally env-driven so
# every co-hosted deployment can keep its own distinct routing identity.
services:
  odoo:
    networks:
      default: {}
      shared_caddy:
        aliases:
          - ${ODOO_SHARED_ALIAS:-hrms-odoo}

networks:
  shared_caddy:
    name: ${SHARED_CADDY_NETWORK:-deploy_default}
    external: true
