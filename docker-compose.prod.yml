# Production overlay - use alongside the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds a Caddy reverse proxy (automatic HTTPS) and stops publishing
# Odoo's ports directly to the host - only Caddy is internet-facing.
#
# restart: unless-stopped on db/odoo (added after a live incident: the
# db container came back up on its own after some disruption on the
# host, odoo didn't, and nothing noticed until a user reported the
# site down) - Docker's default with no restart policy at all is to
# leave a stopped container stopped, whether it stopped from a crash,
# an interrupted deploy, or the host rebooting. "unless-stopped" means
# Docker itself brings both back automatically in all of those cases,
# while still respecting a deliberate `docker compose stop`.
services:
  db:
    restart: unless-stopped

  odoo:
    restart: unless-stopped
    ports: !reset []
    command: odoo -c /etc/odoo/odoo.prod.conf
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      # A distinct bind-mounted (not named-volume) log path, so it has
      # a predictable host filesystem location - fail2ban (running on
      # the host, not in a container, since it needs to reach the
      # host's firewall) reads login failures from here. See
      # deploy/fail2ban/ and docs/SETUP_GUIDE.md.
      - ./logs/odoo:/var/log/odoo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ODOO_UPSTREAM_HOST: ${ODOO_UPSTREAM_HOST:-odoo}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
