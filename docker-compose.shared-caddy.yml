# DEPRECATED - kept for reference only, no longer used by deploy.sh.
#
# This was an optional overlay for co-hosting this stack on a server
# that already runs a separate Caddy instance for another site (e.g.
# bpro's own VPS, which also hosts a client's ME Polymers ERP under
# its own docker-compose project named "deploy"): join the "odoo"
# service to that other project's Docker network under an alias, and
# let its Caddy reverse_proxy to this one instead of running our own.
#
# Abandoned after a real incident: the other project's Caddy container
# and its config directory were renamed/removed during unrelated work
# on the shared VPS, silently cutting this site off from the internet
# with no error on this side - deploy.sh only ever checks that Odoo
# answers internally, never that anything is actually routing the
# public domain to it. docker-compose.prod.yml now runs this stack's
# own dedicated Caddy on 80/443 instead, with zero dependency on any
# other project, container, or team's changes on the host. Do not
# reintroduce this overlay into deploy.sh.
services:
  odoo:
    networks:
      default: {}
      deploy_default:
        aliases:
          - hrms-odoo

networks:
  deploy_default:
    external: true
